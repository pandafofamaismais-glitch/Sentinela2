<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital São Bento | Triagem</title>

    <link rel="stylesheet" href="css/GLOBAL.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/triagem.css">

    <style>

        .btn-tv {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 8px;
        }

        .btn-tv:hover {
            background-color: #1e7e34;
        }

        .pacientes-fila {
            margin-bottom: 30px;
            background-color: #fef4ff;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #d0d8f0;
        }

        .pacientes-fila h3 {
            margin-top: 0;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pacientes-fila h3 span {
            font-size: 13px;
            font-weight: normal;
            color: #666;
        }

        .fila-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border: 1px solid #dce4ff;
        }

        .fila-item strong {
            font-size: 15px;
        }

        .fila-item small {
            color: #888;
            font-size: 12px;
        }

        .btn-abrir-tv {
            display: inline-block;
            background: #17a2b8;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-abrir-tv:hover {
            background: #117a8b;
        }

    </style>

</head>


<body>


    <!-- ===================================================== -->
    <!-- PAINEL DA FILA -->
    <!-- ===================================================== -->

    <div class="container">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        ">

            <h2 style="margin:0;">
                🏥 Triagem Hospital
            </h2>

            <button
                class="btn-abrir-tv"
                onclick="window.open('tv.html','_blank')"
            >
                📺 Abrir Tela da TV
            </button>

        </div>


        <!-- FILA DE PACIENTES -->

        <div class="pacientes-fila">

            <h3>

                Pacientes Cadastrados no Atendimento

                <span>
                    Clique em "Chamar na TV" para chamar ao guichê
                </span>

            </h3>


            <div id="fila-pacientes">

                <p style="
                    color:#888;
                    text-align:center;
                ">
                    Carregando...
                </p>

            </div>


            <button
                onclick="carregarPacientes()"
                style="
                    margin-top:8px;
                    background:#6c757d;
                    color:white;
                    border:none;
                    padding:6px 12px;
                    border-radius:4px;
                    cursor:pointer;
                    font-size:13px;
                "
            >
                🔄 Atualizar lista
            </button>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ===================================================== -->

    <div class="main">

        <div class="topbar">

            <h2>
                Triagem Hospitalar
            </h2>


            <div class="usuario">

                👤 Enfermeiro

            </div>

        </div>


        <div class="content">


            <div class="card">


                <h3>
                    Cadastro da Triagem
                </h3>


                <input
                    id="nome"
                    placeholder="Nome do Paciente"
                >


                <select id="sintoma">

                    <option value="">
                        Selecione o Sintoma
                    </option>

                    <option value="dor_leve">
                        Dor leve
                    </option>

                    <option value="resfriado">
                        Resfriado
                    </option>

                    <option value="coriza">
                        Coriza
                    </option>

                    <option value="tosse">
                        Tosse
                    </option>

                    <option value="febre">
                        Febre
                    </option>

                    <option value="vomito">
                        Vômito
                    </option>

                    <option value="diarreia">
                        Diarreia
                    </option>

                    <option value="falta_ar_moderada">
                        Falta de ar Moderada
                    </option>

                    <option value="falta_ar_grave">
                        Falta de ar Grave
                    </option>

                    <option value="infarto">
                        Suspeita de Infarto
                    </option>

                    <option value="avc">
                        Suspeita de AVC
                    </option>

                    <option value="convulsao">
                        Convulsão
                    </option>

                    <option value="hemorragia">
                        Hemorragia
                    </option>

                </select>


                <input
                    type="number"
                    id="temp"
                    placeholder="Temperatura (°C)"
                >


                <input
                    id="pressao"
                    placeholder="Pressão Arterial (Ex.: 120/80)"
                >


                <input
                    type="number"
                    id="batimentos"
                    placeholder="Frequência Cardíaca (BPM)"
                >


                <input
                    type="number"
                    id="saturacao"
                    placeholder="Saturação (%)"
                >


                <input
                    id="alergia"
                    placeholder="Alergias"
                >


                <textarea
                    id="observacao"
                    placeholder="Observações"
                ></textarea>


                <div id="resultado"></div>


                <button onclick="salvar()">

                    Salvar Triagem

                </button>


            </div>

        </div>

    </div>


    <script>


        // =====================================================
        // API FETCH
        // =====================================================

        async function apiFetch(url, options = {}) {

            const token =
                localStorage.getItem("token") ||
                localStorage.getItem("authToken") ||
                localStorage.getItem("accessToken");


            const headers = {
                ...(options.headers || {})
            };


            /*
             * Se existir token salvo no navegador,
             * envia para o backend.
             */

            if (token) {

                headers["Authorization"] =
                    `Bearer ${token}`;

            }


            /*
             * credentials: "include" permite enviar
             * cookies de autenticação, caso o sistema
             * utilize sessão por cookie.
             */

            return fetch(url, {

                ...options,

                headers: headers,

                credentials: "include"

            });

        }


        // =====================================================
        // CLASSIFICAÇÃO DE RISCO
        // =====================================================

        function classificarRisco(sintoma, temp) {


            if (temp >= 39) {

                return "vermelho";

            }


            if (
                [
                    "infarto",
                    "avc",
                    "convulsao",
                    "hemorragia",
                    "falta_ar_grave"
                ].includes(sintoma)
            ) {

                return "vermelho";

            }


            if (
                [
                    "febre",
                    "vomito",
                    "diarreia",
                    "falta_ar_moderada"
                ].includes(sintoma)
            ) {

                return "amarelo";

            }


            return "verde";

        }


        // =====================================================
        // SALVAR TRIAGEM
        // =====================================================

        async function salvar() {


            const nome =
                document
                    .getElementById("nome")
                    .value
                    .trim();


            const sintoma =
                document
                    .getElementById("sintoma")
                    .value;


            const temperatura =
                Number(
                    document
                        .getElementById("temp")
                        .value
                );


            const pressao =
                document
                    .getElementById("pressao")
                    .value
                    .trim();


            const batimentos =
                document
                    .getElementById("batimentos")
                    .value;


            const saturacao =
                document
                    .getElementById("saturacao")
                    .value;


            const alergia =
                document
                    .getElementById("alergia")
                    .value
                    .trim();


            const observacao =
                document
                    .getElementById("observacao")
                    .value
                    .trim();


            // =================================================
            // VALIDAÇÃO
            // =================================================

            if (!nome) {

                alert("Digite o nome do paciente.");

                return;

            }


            if (!sintoma) {

                alert("Selecione o sintoma.");

                return;

            }


            const dados = {

                nome: nome,

                sintoma: sintoma,

                temperatura: temperatura,

                pressao: pressao,

                batimentos: batimentos,

                saturacao: saturacao,

                alergia: alergia,

                observacao: observacao

            };


            dados.risco =
                classificarRisco(
                    dados.sintoma,
                    dados.temperatura
                );


            try {


                // =================================================
                // ENVIA PARA O BACKEND
                // =================================================

                const resposta =
                    await apiFetch(
                        "/triagem",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    dados
                                )

                        }
                    );


                let data = {};


                try {

                    data =
                        await resposta.json();

                } catch (erroJson) {

                    console.error(
                        "Servidor não retornou JSON:",
                        erroJson
                    );

                }


                if (!resposta.ok) {


                    /*
                     * Mostra a mensagem verdadeira
                     * enviada pelo backend.
                     */

                    throw new Error(

                        data.erro ||

                        data.error ||

                        data.mensagem ||

                        `Erro HTTP ${resposta.status}`

                    );

                }


                // =================================================
                // MOSTRAR RESULTADO
                // =================================================

                const div =
                    document.getElementById(
                        "resultado"
                    );


                div.className =
                    dados.risco;


                div.innerHTML =
                    "Classificação: <b>" +
                    dados.risco.toUpperCase() +
                    "</b>";


                alert(
                    "Triagem salva."
                );


                // =================================================
                // LIMPAR FORMULÁRIO
                // =================================================

                document
                    .getElementById("nome")
                    .value = "";


                document
                    .getElementById("sintoma")
                    .value = "";


                document
                    .getElementById("temp")
                    .value = "";


                document
                    .getElementById("pressao")
                    .value = "";


                document
                    .getElementById("batimentos")
                    .value = "";


                document
                    .getElementById("saturacao")
                    .value = "";


                document
                    .getElementById("alergia")
                    .value = "";


                document
                    .getElementById("observacao")
                    .value = "";


                // =================================================
                // ATUALIZAR FILA
                // =================================================

                carregarPacientes();


            } catch (erro) {


                console.error(
                    "Erro ao salvar triagem:",
                    erro
                );


                alert(
                    erro.message ||
                    "Erro ao salvar triagem."
                );

            }

        }


        // =====================================================
        // CARREGAR FILA
        // =====================================================

        async function carregarPacientes() {


            try {


                const resposta =
                    await apiFetch(
                        "/pacientes"
                    );


                let pacientes = [];


                try {

                    pacientes =
                        await resposta.json();

                } catch (erroJson) {

                    console.error(
                        "Resposta inválida do servidor:",
                        erroJson
                    );

                }


                if (!resposta.ok) {


                    throw new Error(

                        pacientes.erro ||

                        pacientes.error ||

                        "Erro ao carregar pacientes."

                    );

                }


                const div =
                    document.getElementById(
                        "fila-pacientes"
                    );


                /*
                 * SOMENTE PACIENTES COM STATUS TRIAGEM.
                 */

                const fila =
                    Array.isArray(pacientes)

                        ? pacientes.filter(
                            paciente =>
                                paciente.status ===
                                "triagem"
                        )

                        : [];


                if (fila.length === 0) {


                    div.innerHTML =
                        "<p style='color:#888; text-align:center;'>" +
                        "Nenhum paciente aguardando." +
                        "</p>";


                    return;

                }


                div.innerHTML = "";


                fila.forEach(
                    paciente => {


                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "fila-item";


                        // =================================================
                        // INFORMAÇÕES
                        // =================================================

                        const esquerda =
                            document.createElement(
                                "div"
                            );


                        const nome =
                            document.createElement(
                                "strong"
                            );


                        nome.textContent =
                            paciente.nome ||
                            "Paciente";


                        const quebra =
                            document.createElement(
                                "br"
                            );


                        const informacoes =
                            document.createElement(
                                "small"
                            );


                        informacoes.textContent =
                            "CPF: " +
                            (
                                paciente.cpf ||
                                "-"
                            ) +
                            " | Tipo: " +
                            (
                                paciente.tipo ||
                                "-"
                            );


                        esquerda.appendChild(
                            nome
                        );


                        esquerda.appendChild(
                            quebra
                        );


                        esquerda.appendChild(
                            informacoes
                        );


                        // =================================================
                        // BOTÃO TV
                        // =================================================

                        const botao =
                            document.createElement(
                                "button"
                            );


                        botao.className =
                            "btn-tv";


                        botao.textContent =
                            "📺 Chamar na TV";


                        botao.onclick =
                            function() {

                                chamarNaTV(
                                    paciente.nome
                                );

                            };


                        item.appendChild(
                            esquerda
                        );


                        item.appendChild(
                            botao
                        );


                        div.appendChild(
                            item
                        );


                    }
                );


            } catch (erro) {


                console.error(
                    "Erro ao carregar fila:",
                    erro
                );


                document
                    .getElementById(
                        "fila-pacientes"
                    )
                    .innerHTML =

                    "<p style='color:red;'>" +

                    (
                        erro.message ||
                        "Erro ao carregar pacientes."
                    ) +

                    "</p>";

            }

        }


        // =====================================================
        // CHAMAR PACIENTE NA TV
        // =====================================================

        async function chamarNaTV(nome) {


            if (!nome) {

                alert(
                    "Nome do paciente não encontrado."
                );

                return;

            }


            try {


                const resposta =
                    await apiFetch(
                        "/tv/chamar",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    localTipo:
                                        "GUICHÊ",

                                    localNumero:
                                        "01",

                                    paciente:
                                        nome

                                })

                        }
                    );


                let data = {};


                try {

                    data =
                        await resposta.json();

                } catch (erroJson) {

                    console.error(
                        "Resposta inválida:",
                        erroJson
                    );

                }


                if (!resposta.ok) {


                    throw new Error(

                        data.erro ||

                        data.error ||

                        data.mensagem ||

                        `Erro HTTP ${resposta.status}`

                    );

                }


                alert(
                    nome +
                    " foi chamado na TV para o Guichê 01!"
                );


            } catch (erro) {


                console.error(
                    "Erro ao chamar na TV:",
                    erro
                );


                alert(

                    erro.message ||

                    "Erro ao chamar paciente na TV."

                );

            }

        }


        // =====================================================
        // CARREGAR FILA AO ABRIR A PÁGINA
        // =====================================================

        carregarPacientes();


        // =====================================================
        // ATUALIZAR FILA AUTOMATICAMENTE
        // =====================================================

        setInterval(
            carregarPacientes,
            10000
        );


    </script>


</body>

</html>
