<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mídia Indoor - TV</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            background-color: lightslategray;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            overflow: hidden;

        }


        .tv-container {

            display: flex;

            width: 95vw;

            height: 90vh;

            gap: 18px;

        }


        .left-painel {

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 18px;

        }


        .right-painel {

            flex: 3;

            display: flex;

            flex-direction: column;

            gap: 18px;

        }


        .box {

            background-color: aqua;

            border: 6px solid #b39b82;

            border-radius: 15px;

            padding: 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3);

        }


        .box-title {

            color: #ffffff;

            font-size: 2.2vw;

            font-weight: bold;

            text-transform: uppercase;

            text-shadow:
                1px 1px 2px rgba(0, 0, 0, 0.4);

            margin-bottom: 12px;

        }


        /* =========================
           PAINEL ESQUERDO
        ========================== */

        .local-box {

            flex: 1;

        }


        .local-number {

            color: #d12c2c;

            font-size: 9vw;

            font-weight: bold;

            line-height: 1;

        }


        .local-type {

            color: #555;

            font-size: 1.8vw;

            font-weight: bold;

            margin-top: 6px;

        }


        /* =========================
           HISTÓRICO
        ========================== */

        .history-box {

            flex: 1;

            justify-content: flex-start;

            align-items: flex-start;

        }


        .history-box .box-title {

            font-size: 1.8vw;

            align-self: center;

        }


        #history-list {

            list-style: none;

            width: 100%;

            color: #d12c2c;

            font-size: 1.5vw;

            font-weight: bold;

            text-align: left;

        }


        #history-list li {

            margin-bottom: 8px;

            border-bottom:
                1px solid rgba(0, 0, 0, 1);

            padding-bottom: 5px;

        }


        /* =========================
           PAINEL DIREITO
        ========================== */

        .patient-box {

            flex: 3;

        }


        .patient-name {

            color: #d12c2c;

            font-size: 6.5vw;

            font-weight: bold;

            line-height: 1.2;

            word-break: break-word;

        }


        /* =========================
           LOGO
        ========================== */

        .logo-box {

            flex: 1;

        }


        .tv-logo {

            width: 180px;

            max-width: 180px;

            height: auto;

            object-fit: contain;

            display: block;

            margin: 10px auto;

        }


        .logo-text {

            color: #8c3d8c;

            font-size: 3.5vw;

            font-weight: bold;

            text-transform: uppercase;

        }


        /* =========================
           ANIMAÇÃO
        ========================== */

        @keyframes flash {

            0%,
            100% {

                opacity: 1;

            }

            50% {

                opacity: 0.3;

            }

        }


        .flash {

            animation:
                flash 0.5s ease 3;

        }


        /* =========================
           RESPONSIVIDADE
        ========================== */

        @media (max-width: 768px) {

            .tv-logo {

                width: 150px;

                max-width: 150px;

            }

        }


        @media (max-width: 480px) {

            .tv-logo {

                width: 130px;

                max-width: 130px;

            }

        }

    </style>

</head>


<body>


    <div class="tv-container">


        <!-- =========================
             PAINEL ESQUERDO
        ========================== -->

        <div class="left-painel">


            <div class="box local-box">


                <div
                    class="box-title"
                    id="local-type"
                >
                    GUICHÊ
                </div>


                <div
                    class="local-number"
                    id="local-number"
                >
                    --
                </div>


            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">


                <div class="box-title">

                    ÚLTIMAS CHAMADAS

                </div>


                <ul id="history-list"></ul>


            </div>


        </div>


        <!-- =========================
             PAINEL DIREITO
        ========================== -->

        <div class="right-painel">


            <!-- PACIENTE -->

            <div
                class="box patient-box"
                id="patient-box"
            >


                <div class="box-title">

                    PACIENTE

                </div>


                <div
                    class="patient-name"
                    id="patient-name"
                >

                    AGUARDANDO...

                </div>


            </div>


            <!-- LOGO -->

            <div class="box logo-box">


                <img
                    src="imagens/logo.png"
                    alt="Hospital São Bento"
                    class="tv-logo"
                >


                <div class="logo-text">

                    Hospital São Bento

                </div>


            </div>


        </div>


    </div>


    <script>

        let ultimoId = null;


        // =====================================================
        // ATUALIZAR TV
        // =====================================================

        function atualizar() {


            fetch("/tv/chamada")


                .then(async resposta => {


                    if (!resposta.ok) {

                        throw new Error(
                            "Erro ao buscar chamada."
                        );

                    }


                    return await resposta.json();


                })


                .then(data => {


                    const chamada =
                        data.chamada;


                    const historico =
                        data.historico || [];


                    // =============================================
                    // CHAMADA ATUAL
                    // =============================================

                    if (chamada) {


                        document
                            .getElementById(
                                "local-type"
                            )
                            .innerText =
                            chamada.localTipo ||
                            "GUICHÊ";


                        document
                            .getElementById(
                                "local-number"
                            )
                            .innerText =
                            chamada.localNumero ||
                            "--";


                        document
                            .getElementById(
                                "patient-name"
                            )
                            .innerText =
                            chamada.paciente ||
                            "AGUARDANDO...";


                        // =========================================
                        // FLASH PARA CHAMADA NOVA
                        // =========================================

                        if (
                            chamada.id !==
                            ultimoId
                        ) {


                            ultimoId =
                                chamada.id;


                            const patientBox =
                                document
                                    .getElementById(
                                        "patient-box"
                                    );


                            patientBox
                                .classList
                                .remove(
                                    "flash"
                                );


                            void patientBox.offsetWidth;


                            patientBox
                                .classList
                                .add(
                                    "flash"
                                );

                        }

                    }


                    // =============================================
                    // HISTÓRICO
                    // =============================================

                    const list =
                        document
                            .getElementById(
                                "history-list"
                            );


                    list.innerHTML = "";


                    historico
                        .slice(0, 4)
                        .forEach(h => {


                            const li =
                                document
                                    .createElement(
                                        "li"
                                    );


                            const tipo =
                                h.localTipo
                                    ? h.localTipo
                                        .substring(
                                            0,
                                            4
                                        )
                                    : "GUIC";


                            li.innerText =
                                `${tipo}. ${h.localNumero || "--"} - ${h.paciente || "Paciente"}`;


                            list.appendChild(
                                li
                            );

                        });

                })


                .catch(erro => {


                    console.error(
                        "Erro ao buscar chamada:",
                        erro
                    );

                });

        }


        // =====================================================
        // ATUALIZAÇÃO AUTOMÁTICA
        // =====================================================

        atualizar();


        setInterval(
            atualizar,
            2000
        );

    </script>


</body>

</html>
